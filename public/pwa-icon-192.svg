<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="0" y="0" width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  
  <!-- Subtle Christmas Sphere Halo -->
  <circle cx="96" cy="85" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="6,4"/>
  <rect x="91" y="24" width="10" height="8" rx="2" fill="url(#goldGrad)" opacity="0.6"/>
  <circle cx="96" cy="22" r="6" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Sparkles -->
  <polygon points="145,50 148,60 158,63 148,66 145,76 142,66 132,63 142,60" fill="#fde047" opacity="0.85"/>
  <polygon points="45,115 47,121 53,123 47,125 45,131 43,125 37,123 43,121" fill="#fde047" opacity="0.75"/>

  <!-- Logo GT Monogram -->
  <text x="96" y="112" font-family="Plus Jakarta Sans, system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#shadow)" letter-spacing="-2">
    GT
  </text>

  <!-- Golden Banner -->
  <rect x="28" y="136" width="136" height="26" rx="13" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="96" y="153" font-family="Plus Jakarta Sans, system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2">
    GRUPO TRIBUNA
  </text>
</svg>
